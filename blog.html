<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket Fan · Carousel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #111;
            color: white;
        }

        .carousel {
            margin-top: 56px;
        }
        
        .carousel-item img {
            height: 500px;
            object-fit: cover;
        }
        
        .carousel-caption {
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 20px;
            bottom: 20px;
        }

        .navbar-brand {
            color: orange !important;
            font-weight: bold;
        }

        .btn-primary {
            background-color: orange;
            border: none;
        }

        .btn-primary:hover {
            background-color: darkorange;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">🏀 Basket Fan</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                
                <li class="nav-item">
                    <a class="nav-link" 
                       href="https://docs.google.com/document/d/1KpaM3vry47hieM_KsefDQsG6VEq-JGf11Bqdz_D832s/edit?usp=sharing" 
                       target="_blank">
                       Documento
                    </a>
                </li>

                <li class="nav-item"><a class="nav-link disabled" href="#">NBA</a></li>
            </ul>
        </div>
    </div>
</nav>

<main>

<!-- CAROUSEL -->
<div id="myCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-inner">
        
        <!-- MICHAEL JORDAN -->
        <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1608245449230-4ac19066d2d0" class="d-block w-100">
            <div class="container">
                <div class="carousel-caption text-start">
                    <h1>Michael Jordan 🐐</h1>
                    <p>El GOAT. 6 anillos y una mentalidad legendaria.</p>
                    
                    <p>
                        <a class="btn btn-lg btn-primary" 
                           href="https://docs.google.com/document/d/1KpaM3vry47hieM_KsefDQsG6VEq-JGf11Bqdz_D832s/edit?usp=sharing" 
                           target="_blank">
                           Ir al documento
                        </a>
                    </p>
                </div>
            </div>
        </div>
        
        <!-- KOBE -->
        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc" class="d-block w-100">
            <div class="container">
                <div class="carousel-caption">
                    <h1>Kobe Bryant 🐍</h1>
                    <p>Mamba Mentality. Trabajo duro todos los días.</p>
                </div>
            </div>
        </div>
        
        <!-- LEBRON -->
        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1504450758481-7338eba7524a" class="d-block w-100">
            <div class="container">
                <div class="carousel-caption text-end">
                    <h1>LeBron James 👑</h1>
                    <p>Dominio total y longevidad histórica.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- CONTROLES -->
    <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>

<!-- FOOTER -->
<footer class="container py-4">
    <p class="text-center">🏀 Basket Fan Page - Pasión por la NBA © 2026</p>
</footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
